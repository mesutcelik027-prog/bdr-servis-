const authD=()=>{if(!D.data.auth||!Array.isArray(D.data.auth.users))D.data.auth={t:"auth",v:1,users:[]};return D.data.auth};
const alogD=()=>{if(!D.data.alog||!Array.isArray(D.data.alog.items))D.data.alog={t:"alog",items:[]};return D.data.alog};
const recList=a=>{const o=[],seen=new Set();[...(a.recs||[]),...(a.rec?[a.rec]:[])].forEach(r=>{if(r&&r.hash&&!seen.has(r.hash)){seen.add(r.hash);o.push(r)}});return o};
const rndS=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
async function pinHash(p,s){const b=new TextEncoder().encode(s+":"+p);try{if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,"0")).join("")}}catch(x){}let h=5381;for(const c of b)h=((h<<5)+h+c)>>>0;return"f"+h}
const recNorm=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function logAdd(a,ty,r,d){const L=alogD().items,t=new Date().toISOString(),p=L[L.length-1];
 if(p&&a==="degis"&&p.a===a&&p.u===(CU?CU.id:"")&&p.ty===(ty||"")&&p.r===(r||"")&&p.d===(d||"")&&Date.parse(t)-Date.parse(p.ts)<120000){p.ts=t;return}
 L.push({ts:t,u:CU?CU.id:"",un:CU?CU.name:"",a,ty:ty||"",r:r||"",d:d||""});if(L.length>5000)L.splice(0,L.length-5000)}
const auHash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+":"+s.length};
function auLabel(k,d){if(k==="tplx")return["Bakım paketi şablonları",""];if(k==="cfg")return["Ayarlar",""];
 if(!d.t)return["Araç",d.plate||d.no||k];if(d.t==="s")return["Stok",d.name||k];
 if(d.t==="c")return[d.type==="tedarikci"?"Tedarikçi":"Müşteri",d.name||k];
 if(d.t==="p")return["Tedarikçi ödemesi",((D.data[d.sup]&&D.data[d.sup].name)||"")+" "+tl(d.amt||0)];
 if(d.t==="i")return["İade kaydı",tl(d.amt||0)];return[String(d.t),d.name||k]}
function auSnap(){const m=new Map();for(const k in D.data){if(k==="alog"||k==="auth"||k==="meta")continue;const d=D.data[k];if(!d||typeof d!=="object"||d.draft)continue;
  try{const l=auLabel(k,d);m.set(k,{h:auHash(JSON.stringify(d)),ty:l[0],r:l[1],ll:(d.log||[]).length,jl:(d.jobs||[]).length,pl:(d.pays||[]).length})}catch(x){}}return m}
function auDiff(prev,next){const out=[];
 next.forEach((n,k)=>{const o=prev.get(k);if(!o){out.push({a:"ekle",ty:n.ty,r:n.r,d:""});return}
  if(o.h!==n.h){let d="";const dd=D.data[k];if(dd&&!dd.t){const nl=(dd.log||[]).slice(o.ll).map(x=>x.t);
   if(nl.length)d=nl.slice(-3).join(" · ");else if(n.jl!==o.jl)d=n.jl>o.jl?"İşlem eklendi":"İşlem silindi";else if(n.pl!==o.pl)d=n.pl>o.pl?"Ödeme eklendi":"Ödeme silindi"}
   out.push({a:"degis",ty:n.ty,r:n.r,d})}});
 prev.forEach((o,k)=>{if(!next.has(k))out.push({a:"sil",ty:o.ty,r:o.r,d:""})});return out}
async function save(){
 if(!CU||!auPrev)return saveRaw();
 const nx=auSnap(),ch=auDiff(auPrev,nx);
 if(ch.length&&!can("edit")){try{D.data=(await idbGet())||{};tplApply()}catch(x){}
  auPrev=auSnap();wz=null;cur=null;tab="home";edit=false;jf=null;try{render();toast("⚠️ Değişiklik yetkiniz yok, kaydedilmedi",1)}catch(x){}return false}
 if(ch.length){if(ch.length>25){const c={a:0,d:0,s:0};ch.forEach(x=>c[x.a==="ekle"?"a":x.a==="sil"?"s":"d"]++);logAdd("toplu","Toplu işlem",ch.length+" kayıt","+"+c.a+" ~"+c.d+" -"+c.s)}else ch.forEach(x=>logAdd(x.a,x.ty,x.r,x.d))}
 auPrev=nx;return saveRaw()}

async function lgLogin(){const S=lgState,u=authD().users.find(x=>x.id===S.uid),p=(document.getElementById("lgp")||{}).value||"";if(!u)return;
 if(S.lock>Date.now()){S.err="Çok fazla hatalı deneme. "+Math.ceil((S.lock-Date.now())/1000)+" sn bekleyin.";lgDraw();return}
 if((await pinHash(p,u.salt))===u.hash){S.fails={};lgFinish(u)}
 else{S.fails[u.id]=(S.fails[u.id]||0)+1;if(S.fails[u.id]>=5){S.fails[u.id]=0;S.lock=Date.now()+30000;S.err="5 hatalı deneme. 30 sn bekleyin."}else S.err="PIN yanlış ("+S.fails[u.id]+"/5)";lgDraw()}}

 pg.forEach((cv,i)=>{const b64=cv.toDataURL("image/jpeg",0.92).split(",")[1],bin=atob(b64),jp=new Uint8Array(bin.length);for(let n=0;n<bin.length;n++)jp[n]=bin.charCodeAt(n);
  const id=3+3*i,cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
  obj(id,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+(id+2)+" 0 R >> >> /Contents "+(id+1)+" 0 R >>"));
  obj(id+1,()=>push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"));
  obj(id+2,()=>{push("<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jp.length+" >>\nstream\n");push(jp);push("\nendstream")})});
 const xr=len,cnt=3+3*pg.length;push("xref\n0 "+cnt+"\n0000000000 65535 f \n");for(let id=1;id<cnt;id++)push(String(offs[id]).padStart(10,"0")+" 00000 n \n");
 push("trailer\n<< /Size "+cnt+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");return pdfTag(new Blob(ch,{type:"application/pdf"}),pg)}

const OIL_KM=10000,OIL_DAYS=365,WARN_KM=1000,WARN_DAYS=30;
const isOil=j=>{const t=nk(j.desc);return (/yağ/.test(t)&&!/şanzıman|fren|hidrolik|direksiyon/.test(t))||(j.parts||[]).some(p=>/motor yağı/.test(nk(p.name)))};
function oilDue(){const o=[],t0=new Date(today()+"T00:00:00"),g=new Map();V().forEach(v=>{const k=pk(v.plate)||"id"+v.id;(g.get(k)||g.set(k,[]).get(k)).push(v)});
 g.forEach((vs,k)=>{let last=null;vs.forEach(v=>(v.jobs||[]).forEach(j=>{if(j.date&&isOil(j)&&(!last||j.date>last.date))last={date:j.date,km:+j.km||0}}));if(!last)return;
  if(vs.some(v=>v.oilRem&&Math.round((t0-new Date(v.oilRem+"T00:00:00"))/864e5)<30))return;
  const days=Math.round((t0-new Date(last.date+"T00:00:00"))/864e5),curKm=Math.max(0,...vs.map(v=>+v.km||0)),kmS=last.km>0&&curKm>last.km?curKm-last.km:0,rs=[];
  if(days>=OIL_DAYS-WARN_DAYS)rs.push("Son bakımdan "+(days>=60?Math.round(days/30)+" ay":days+" gün")+" geçti");
  if(kmS>=OIL_KM-WARN_KM)rs.push("Son bakımdan bu yana ~"+kmS.toLocaleString("tr-TR")+" km");
  if(!rs.length)return;const m=vs[0];o.push({key:k,ids:vs.map(v=>v.id),plate:m.plate||m.no,brand:m.brand||"",owner:m.owner||"",phone:m.phone||"",last,days,why:rs.join(" · ")})});
 return o.sort((a,b)=>b.days-a.days)}
